<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>남편 개조 프로젝트</title>
<meta name="description" content="소파와 한 몸이 된 남편을 7일 안에 집안일 하는 남자로! 혼자 해도, 부부가 같이 해도 되는 3D 게임">
<meta name="theme-color" content="#0b0d14">
<meta property="og:type" content="website">
<meta property="og:title" content="남편 개조 프로젝트">
<meta property="og:description" content="소파와 한 몸이 된 남편을 7일 안에 집안일 하는 남자로!">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"/vendor/three.module.min.js","three/addons/":"/vendor/jsm/"}}</script>
<style>
:root{--ink:#eef0f7;--dim:#9aa3bd;--panel:rgba(14,16,24,.94);--panel2:rgba(46,50,66,.97);--line:rgba(255,255,255,.08);--accent:#ff9a4a;--gold:#e9c46a;--me:#c0453a;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0d14;color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;font-weight:500;-webkit-font-smoothing:antialiased}
canvas#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 50%,rgba(0,0,0,.5) 100%)}
button{font:inherit;color:inherit;cursor:pointer}
.pn{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 6px 20px rgba(0,0,0,.35)}
.hide{display:none!important}

/* 머리 위 표시 */
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:5px;will-change:transform}
.tag .name{font-size:13.5px;font-weight:700;padding:4px 10px 4px 5px;border-radius:9px;background:rgba(10,12,18,.9);color:#fff;white-space:nowrap;display:flex;gap:6px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.tag .name i{font-style:normal;font-size:11.5px;font-weight:700;background:#3f5fa8;color:#fff;border-radius:6px;padding:1px 7px}
.tag.me .name i{background:var(--me)}
.tag .name .bar{width:54px;height:8px;border-radius:6px;background:rgba(255,255,255,.16);overflow:hidden;margin-left:2px}
.tag .name .bar b{display:block;height:100%;border-radius:6px;background:#5fd38d;transition:width .35s}
.tag .name em{font-style:normal;font-weight:900;font-size:14px;color:#fff;min-width:18px}
.tag .state{font-size:14.5px;font-weight:700;padding:4px 12px;border-radius:9px;background:linear-gradient(180deg,#f2cf72,#d4a23e);color:#2a1c06;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.tag.kid .name{font-size:12px;padding:3px 8px 3px 4px}
.tag .bubble{max-width:220px;font-size:15px;font-weight:500;line-height:1.45;padding:8px 12px;border-radius:14px;background:rgba(250,246,238,.97);color:#231c16;box-shadow:0 6px 18px rgba(0,0,0,.35);word-break:keep-all;opacity:0;transform:translateY(4px);transition:opacity .25s,transform .25s;position:relative;text-align:center}
.tag .bubble.show{opacity:1;transform:none}
.tag .bubble:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:rgba(250,246,238,.97);border-bottom:0}
.tag .bubble.emo{background:transparent;box-shadow:none;font-size:30px;padding:0}
.tag .bubble.emo:after{display:none}
.float{position:fixed;transform:translate(-50%,0);font-size:19px;font-weight:900;pointer-events:none;animation:up 1.2s forwards;text-shadow:0 1px 6px #000;white-space:nowrap;z-index:3}
@keyframes up{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-60px}}

/* 왼쪽 위 카드 */
.card0{position:fixed;top:calc(10px + var(--st));left:10px;right:76px;max-width:460px;border-radius:16px;padding:12px 14px;pointer-events:none}
.card0 .t1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card0 .logo{font-size:19px;font-weight:900;letter-spacing:-.5px}
.card0 .logo small{font-size:12px;color:var(--dim);margin-left:6px}
.card0 .ap{font-size:13px;color:var(--dim);display:flex;align-items:center;gap:3px}
.card0 .ap{font-weight:700}.card0 .ap span{flex:0 0 9px;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px rgba(255,154,74,.7)}
.card0 .ap span.off{background:rgba(255,255,255,.14);box-shadow:none}
.card0 .ap span.bonus{background:#ffd23a;box-shadow:0 0 8px #ffd23a}
.card0 .sub{margin-top:8px;background:rgba(255,255,255,.05);border-radius:10px;padding:7px 10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.stat label{display:flex;justify-content:space-between;font-size:12.5px;color:#aab3cc}
.stat label b{font-weight:900;color:#fff}
.track{height:5px;background:rgba(255,255,255,.1);border-radius:5px;overflow:hidden;margin-top:4px}
.fill{height:100%;border-radius:5px;transition:width .4s}
.card0 .who{margin-top:6px;font-size:12.5px;color:#aab3cc}
.card0{pointer-events:auto}
.live{margin-top:7px;border:0;background:rgba(95,211,141,.12);color:#cfeedd;border-radius:999px;padding:4px 10px 4px 8px;font-size:12px;display:inline-flex;align-items:center;gap:6px}
.live i{width:7px;height:7px;border-radius:50%;background:#5fd38d;box-shadow:0 0 8px #5fd38d;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}
.stt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.stt div{background:rgba(255,255,255,.05);border-radius:12px;padding:10px}.stt b{display:block;font-size:22px;font-weight:400;color:#fff}.stt small{color:var(--dim);font-size:12px}

/* 오른쪽 아이콘 줄 */
.rcol{position:fixed;top:calc(10px + var(--st));right:10px;display:flex;flex-direction:column;gap:8px}
.ib{width:56px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
.ib svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib:active{transform:scale(.95)}
.ib:disabled{opacity:.35}

/* 왼쪽 행동 버튼 */
.lcol{position:fixed;left:10px;bottom:calc(12px + var(--sb));display:flex;flex-direction:column;gap:7px;border-radius:16px;padding:7px}
.lb{width:64px;height:62px;border:0;border-radius:12px;background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;;font-size:13px;font-weight:700;color:#f0f2f8}
.lb .i{font-size:22px;line-height:1}
.lb:active{transform:scale(.95)}
.lb:disabled{opacity:.35}
.lb.hot{box-shadow:0 0 0 2px var(--gold) inset,0 0 14px rgba(233,196,106,.4)}

/* 아래 가운데 패널 */
.bpanel{position:fixed;left:94px;right:86px;bottom:calc(12px + var(--sb));border-radius:16px;padding:7px;display:flex;flex-direction:column;gap:7px;max-height:58vh;overflow:auto}
.bpanel .q{font-size:14.5px;font-weight:700;color:#f6ead0;padding:4px 6px 0;line-height:1.45}
.bpanel .q small{color:#aab3cc;font-size:12.5px;font-weight:500}
.ch{border:0;border-radius:11px;background:var(--panel2);padding:12px 12px;font-size:16px;font-weight:700;text-align:center;color:#fff;line-height:1.3}
.ch small{display:block;font-size:12.5px;font-weight:500;color:#b7bfd6;margin-top:3px}
.ch:active{transform:scale(.98)}
.ch:disabled{opacity:.38}
.ch.hot{box-shadow:0 0 0 2px var(--gold) inset}
.ch.go{background:linear-gradient(180deg,#f0b057,#d9822e);color:#2a1406}
.ch.go small{color:#5a3410}
.ch .pb{height:5px;border-radius:4px;background:rgba(255,255,255,.12);margin-top:6px;overflow:hidden}
.ch .pb b{display:block;height:100%;background:#5fd38d}
.row2{display:flex;gap:7px}.row2 .ch{flex:1;padding:10px 6px}
.rb{position:fixed;right:10px;bottom:calc(12px + var(--sb));width:68px;height:74px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12.5px;font-weight:700;border:1px solid var(--line)}
.rb .i{font-size:23px}

.toast{position:fixed;left:50%;top:calc(150px + var(--st));transform:translate(-50%,-8px);padding:11px 16px;border-radius:12px;font-size:15px;font-weight:700;border:1px solid rgba(242,207,114,.35)!important;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;z-index:5;max-width:88vw;text-align:center;line-height:1.5}
.toast.show{opacity:1;transform:translate(-50%,0)}
#night{position:fixed;inset:0;background:#05070e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:23px;opacity:0;pointer-events:none;transition:opacity .7s;z-index:8;text-align:center;padding:20px}
#night.on{opacity:1}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9;transition:opacity .35s}
#flash.on{opacity:.9;transition:none}

/* 모달 */
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,6,10,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:10;padding:16px}
.card{width:min(400px,100%);background:rgba(20,22,30,.97);border:1px solid var(--line);border-radius:22px;padding:22px 20px;text-align:center;max-height:92vh;overflow:auto}
.card .em{font-size:50px;line-height:1.1}
.card h2{margin:6px 0 8px;font-weight:900;font-size:23px}
.card p{margin:0 0 8px;color:#b7bfd6;font-size:15px;line-height:1.7;text-align:left}
.card p b{color:#fff;font-weight:700}
.primary{font-size:16px;width:100%;padding:13px;border-radius:13px;border:0;background:linear-gradient(180deg,#f0b057,#d9822e);color:#2a1406;margin-top:10px}
.ghost{font-size:15px;width:100%;padding:12px;border-radius:13px;border:1px solid rgba(255,255,255,.14);background:transparent;margin-top:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.pick{border:2px solid transparent;background:rgba(255,255,255,.05);border-radius:14px;padding:10px 8px;text-align:center}
.pick .i{font-size:28px}
.pick b{display:block;font-weight:400;font-size:14.5px;margin-top:2px}
.pick small{display:block;color:var(--dim);font-size:11.5px;line-height:1.45;margin-top:3px}
.pick.sel{border-color:var(--accent);background:rgba(255,154,74,.12)}
.end{background:rgba(255,255,255,.05);border-radius:12px;padding:10px 6px}
.end .i{font-size:28px}.end b{display:block;font-weight:400;font-size:13px;margin-top:3px}.end small{display:block;color:var(--dim);font-size:11px;margin-top:2px;line-height:1.4}
.end.lock{opacity:.45}
.sw{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 14px}
.sw button{border:2px solid transparent;border-radius:12px;padding:4px;background:rgba(255,255,255,.05);font-size:11px;color:var(--dim);width:72px}
.sw button i{display:block;height:30px;border-radius:8px;margin-bottom:4px}
.sw button.sel{border-color:var(--accent);color:var(--ink)}
.sw button:disabled{opacity:.5}
.lbl{font-size:13px;color:var(--dim);text-align:left;margin-top:6px}
.code{font-size:34px;letter-spacing:8px;margin:6px 0;color:#ffd9a8}
.linkbox{font-size:12.5px;color:var(--dim);word-break:break-all;background:rgba(255,255,255,.05);border-radius:10px;padding:8px}
#shareImg{width:100%;border-radius:12px;margin-top:6px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:14px;z-index:20;background:#0b0d14}
@media (max-width:380px){.lb{width:58px;height:56px;font-size:11.5px}.bpanel{left:84px;right:80px}.rb{width:62px}}
</style>
<style>
/* ---- 작게 접은 화면 (게임 화면을 넓게) ---- */
.card0{right:auto;width:min(62vw,280px);padding:7px 10px 8px;border-radius:13px}
.card0 .t1{justify-content:flex-start;gap:8px}
.card0 .t1 b{font-size:13.5px;font-weight:900;white-space:nowrap}
.card0 .ap{font-size:11px;gap:2px}.card0 .ap span{flex:0 0 7px;width:7px;height:7px}
.card0 .sub{margin-top:6px;padding:0;background:none;gap:8px}
.stat label{font-size:11px}.stat label b{font-size:11.5px}
.track{height:4px;margin-top:3px}
.card0 .who{display:none}
.live{margin:0 0 0 auto;padding:2px 7px 2px 6px;font-size:11px;gap:4px;font-weight:700}
.live i{width:6px;height:6px}
.rcol{gap:6px}
.ib{width:42px;height:42px;border-radius:12px}
.ib svg{width:20px;height:20px}
.menu{position:fixed;top:calc(58px + var(--st));right:10px;border-radius:14px;padding:6px;display:none;flex-direction:column;z-index:7;min-width:170px}
.menu.show{display:flex}
.menu button{border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:9px;font-size:14px;font-weight:700;display:flex;gap:8px;align-items:center}
.menu button:active{background:rgba(255,255,255,.08)}
.menu svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.abar{position:fixed;left:8px;right:8px;bottom:calc(8px + var(--sb));border-radius:16px;padding:5px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;max-width:640px;margin:0 auto}
.abar::-webkit-scrollbar{display:none}
.lb{flex:1 0 42px;width:auto;height:50px;border-radius:11px;font-size:11px;gap:2px;padding:0 2px;white-space:nowrap}
.lb .i{font-size:19px}
.lb.main{flex:1.4 0 60px;background:linear-gradient(180deg,#f0b057,#d9822e);color:#2a1406}
.lb.main:disabled{background:var(--panel2);color:#9aa3bd}
.bpanel{left:8px;right:8px;bottom:calc(70px + var(--sb));max-width:520px;margin:0 auto;max-height:42vh;padding:6px;gap:5px;border-radius:14px;display:none}
.bpanel.show{display:flex}
.bpanel .q{font-size:13px;padding:2px 4px 0;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.bpanel .q small{font-size:11.5px}
.ch{padding:8px 10px;font-size:14px;border-radius:10px;text-align:left}
.ch small{font-size:11.5px;margin-top:1px}
.ch .pb{height:4px;margin-top:4px}
.ch.close{padding:6px;text-align:center;font-size:13px;color:#aab3cc;background:transparent}
.toast{top:calc(64px + var(--st));font-size:13.5px;padding:8px 13px;max-width:80vw}
.tag .name{font-size:12px;padding:3px 8px 3px 4px}
.cal{display:none;gap:3px;margin-top:6px}.cal.show{display:flex}
.cal i{flex:1;height:15px;border-radius:4px;background:rgba(255,255,255,.08);font-size:9.5px;text-align:center;line-height:15px;font-style:normal;color:#aab3cc}
.cal i.ok{background:#2f7f4f;color:#fff}.cal i.no{background:#8f3f3f;color:#fff}.cal i.today{outline:1.5px solid #ffd23a}
#night{white-space:pre-line;line-height:1.6}
.eps{display:flex;flex-direction:column;gap:8px;margin:6px 0 4px}
.pick.ep{display:flex;gap:12px;align-items:center;text-align:left;padding:11px 12px}
.pick.ep .i{font-size:32px}.pick.ep b{margin:0;font-weight:900}.pick.ep small{margin-top:2px}
.pick.ep:disabled{opacity:.45}
.tag .name i{font-size:10.5px;padding:1px 6px}
.tag .name .bar{width:44px;height:6px}
.tag .name em{font-size:12.5px}
.tag .state{font-size:12.5px;padding:3px 9px}
.tag .bubble{font-size:13.5px;max-width:190px;padding:6px 10px}
.float{font-size:16px}
</style>
</head>
<body>
<div id="loading">집에 들어가는 중…</div>
<canvas id="scene"></canvas>
<div id="vignette"></div>
<div id="labels"></div>

<div class="card0 pn">
  <div class="t1"><b id="dayTxt">1일차 / 7</b><div class="ap" id="apBox"></div><button class="live" id="liveBtn"><i></i><span id="liveTxt">…</span></button></div>
  <div class="sub">
    <div class="stat"><label><span id="l1">의욕</span> <b id="motV">0</b></label><div class="track"><div class="fill" id="mot" style="background:#5fd38d"></div></div></div>
    <div class="stat"><label><span id="l2">반발</span> <b id="resV">0</b></label><div class="track"><div class="fill" id="res" style="background:#ef6a5a"></div></div></div>
    <div class="stat"><label><span id="l3">개조</span> <b id="habV">0%</b></label><div class="track"><div class="fill" id="hab" style="background:linear-gradient(90deg,#f0b057,#ff7a9a)"></div></div></div>
  </div>
  <div class="cal" id="calRow"></div>
  <div class="who" id="whoTxt"></div>
</div>

<div class="rcol">
  <button class="ib pn" id="menuBtn" title="메뉴"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <button class="ib pn" id="endBtn" title="하루 마치기"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
</div>
<div class="menu pn" id="menu">
  <button id="helpBtn">❓ 하는 법</button>
  <button id="bookBtn">📖 엔딩 도감</button>
  <button id="decorBtn">🎨 꾸미기</button>
  <button id="shareBtn">📤 결과 공유</button>
  <button id="viewBtn">👁️ 집 전체 보기</button>
  <button id="soundBtn"><svg viewBox="0 0 24 24" id="soundIco"></svg><span>소리 켜기/끄기</span></button>
  <button id="statsBtn">👥 접속자 현황</button>
</div>

<div class="bpanel pn" id="bpanel"></div>
<div class="abar pn" id="lcol"></div>

<div class="toast pn" id="toast"></div>
<div id="night"></div>
<div id="flash"></div>
<div class="overlay" id="modal"><div class="card" id="modalCard"></div></div>

<script type="module" src="./house.js"></script>
</body>
</html>
