<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>남편 개조 프로젝트</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<meta name="theme-color" content="#0b111f">
<meta property="og:type" content="website">
<meta property="og:title" content="남편 개조 프로젝트">
<meta property="og:description" content="소파와 한 몸이 된 곰돌이 남편을 7일 안에 집안일 하는 남자로!">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<style>
:root{--ink:#eef0f7;--dim:#9aa3bd;--navy:rgba(13,17,34,.82);--line:rgba(150,165,220,.14);--accent:#ff9a4a;--me:#a8321f;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b111f;color:var(--ink);font-family:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
canvas#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,0) 45%,rgba(3,5,12,.55) 100%)}
button{font:inherit;color:inherit}
.glass{background:var(--navy);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:5px;will-change:transform}
.tag .name{display:flex;align-items:center;gap:6px;font-size:13px;padding:4px 11px 4px 5px;border-radius:999px;background:rgba(14,16,28,.72);color:#f2f0ea;white-space:nowrap}
.tag .name i{font-style:normal;font-size:11px;background:#3f5fa8;color:#fff;border-radius:999px;padding:2px 8px}
.tag.me .name i{background:var(--me)}
.tag .bubble{max-width:210px;font-size:14px;line-height:1.45;padding:8px 12px;border-radius:16px;background:rgba(250,246,238,.96);color:#231c16;box-shadow:0 6px 18px rgba(0,0,0,.35);word-break:keep-all;opacity:0;transform:translateY(4px);transition:opacity .25s,transform .25s;position:relative;text-align:center}
.tag .bubble.show{opacity:1;transform:none}
.tag .bubble:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:rgba(250,246,238,.96);border-bottom:0}
.tag .bubble.emo{background:transparent;box-shadow:none;font-size:28px;padding:0}
.tag .bubble.emo:after{display:none}
.float{position:fixed;transform:translate(-50%,0);font-size:17px;pointer-events:none;animation:up 1.2s forwards;text-shadow:0 1px 6px #000;white-space:nowrap;z-index:3}
@keyframes up{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-60px}}
.topbar{position:fixed;top:calc(12px + var(--st));left:12px;right:12px;display:flex;gap:8px;align-items:center;pointer-events:none}
.topbar .sp{flex:1}
.chip{pointer-events:auto;height:42px;min-width:42px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 14px;font-size:14px;cursor:pointer;color:var(--ink);white-space:nowrap}
.chip svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chip.round{padding:0;width:42px}
.chip:active{transform:scale(.96)}
.chip:disabled{opacity:.4}
.dots span{flex:0 0 8px;display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-left:3px;box-shadow:0 0 6px rgba(255,154,74,.7)}
.dots span.off{background:rgba(255,255,255,.15);box-shadow:none}
.stats{position:fixed;top:calc(62px + var(--st));left:12px;right:12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:8px 12px;border-radius:16px;pointer-events:none;max-width:520px}
.stat label{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}
.stat label b{font-weight:400;color:var(--ink)}
.track{height:6px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden;margin-top:4px}
.fill{height:100%;border-radius:6px;transition:width .4s}
.toast{position:fixed;left:50%;top:calc(122px + var(--st));transform:translate(-50%,-8px);padding:10px 16px;border-radius:14px;font-size:14px;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;z-index:5;max-width:92vw;text-align:center;line-height:1.5}
.toast.show{opacity:1;transform:translate(-50%,0)}
.bottom{position:fixed;left:50%;bottom:calc(12px + var(--sb));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:min(640px,calc(100vw - 20px))}
.actbar{display:flex;gap:2px;padding:8px 6px;border-radius:26px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.actbar::-webkit-scrollbar{display:none}
.act{flex:0 0 auto;min-width:58px;border:0;background:transparent;border-radius:16px;padding:6px 7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:#dfe3f0;transition:background .15s,transform .1s}
.act .i{font-size:22px;line-height:1}
.act:active{transform:scale(.95)}
.act:disabled{opacity:.35}
.act.hot{background:rgba(255,200,90,.22);box-shadow:0 0 14px rgba(255,200,90,.35)}
.sheet{width:100%;border-radius:22px;padding:14px;display:none;max-height:52vh;overflow:auto}
.sheet.show{display:block}
.sheet h3{margin:0 0 4px;font-weight:400;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.sheet p{margin:2px 0 8px;color:var(--dim);font-size:13px}
.x{border:0;background:rgba(255,255,255,.08);border-radius:10px;padding:4px 10px;cursor:pointer}
.chore{display:flex;align-items:center;gap:10px;padding:9px 6px;border-top:1px solid var(--line)}
.chore .nm{font-size:15px}
.chore .info{flex:1;min-width:0}
.chore .rq{font-size:12px;color:var(--dim);margin-top:3px}
.chore .track{height:5px}
.chore button{border:0;border-radius:12px;padding:9px 14px;background:linear-gradient(180deg,#ffb067,#f0782e);color:#2a1406;cursor:pointer;flex:0 0 auto}
.chore button:disabled{background:rgba(255,255,255,.1);color:var(--dim)}
.ok{color:#8fe3b8}.meh{color:#ffd27a}
#night{position:fixed;inset:0;background:#05070e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;opacity:0;pointer-events:none;transition:opacity .7s;z-index:8}
#night.on{opacity:1}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,7,14,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:10;padding:16px}
.overlay.hide{display:none}
.card{width:min(390px,100%);background:rgba(16,20,38,.95);border:1px solid var(--line);border-radius:24px;padding:24px 22px;text-align:center;max-height:92vh;overflow:auto}
.card .em{font-size:52px}
.card h2{margin:6px 0 8px;font-weight:400;font-size:24px}
.card p{margin:0 0 6px;color:var(--dim);font-size:14px;line-height:1.7;text-align:left}
.primary{font-size:16px;width:100%;padding:13px;border-radius:14px;border:0;background:linear-gradient(180deg,#ffb067,#f0782e);color:#2a1406;cursor:pointer;margin-top:14px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:14px;z-index:20;background:#0b111f}
@media (max-width:640px){.actbar{width:100%;justify-content:space-between}.act{min-width:0;flex:1 1 0;font-size:11px;padding:5px 2px;white-space:nowrap}.act .i{font-size:20px}}
</style>
</head>
<body>
<div id="loading">집에 들어가는 중…</div>
<canvas id="scene"></canvas>
<div id="vignette"></div>
<div id="labels"></div>
<div class="topbar">
  <div class="chip glass" id="dayChip">1일차 / 7</div>
  <div class="chip glass dots" id="apChip"></div>
  <div class="sp"></div>
  <button class="chip glass round" id="viewBtn" title="시점 바꾸기"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
  <button class="chip glass round" id="helpBtn" title="도움말"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.2v.1"/></svg></button>
  <button class="chip glass round" id="endBtn" title="하루 마치기"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
</div>
<div class="stats glass">
  <div class="stat"><label>의욕 <b id="motV">0</b></label><div class="track"><div class="fill" id="mot" style="background:#5fd3a5"></div></div></div>
  <div class="stat"><label>반발심 <b id="resV">0</b></label><div class="track"><div class="fill" id="res" style="background:#ef6a5a"></div></div></div>
  <div class="stat"><label>개조율 <b id="habV">0%</b></label><div class="track"><div class="fill" id="hab" style="background:linear-gradient(90deg,#ffb067,#ff7a9a)"></div></div></div>
</div>
<div class="toast glass" id="toast"></div>
<div class="bottom">
  <div class="sheet glass" id="sheet"></div>
  <div class="actbar glass" id="actbar"></div>
</div>
<div id="night"></div>
<div class="overlay" id="modal"><div class="card"><div class="em" id="mEm">🛋️</div><h2 id="mTitle">남편 개조 프로젝트</h2><div id="mText"></div><button class="primary" id="mBtn">시작하기</button></div></div>

<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';

const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a=0,b=1)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const isTouch=matchMedia('(pointer:coarse)').matches;

/* =============== 렌더러 · 빛 =============== */
const canvas=$('scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'});
const PR=()=>Math.min(devicePixelRatio||1,isTouch?1.5:2);
renderer.setPixelRatio(PR());
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0b111f);
scene.fog=new THREE.FogExp2(0x0e1426,.018);
const camera=new THREE.PerspectiveCamera(50,1,.1,200);
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(256,256),.55,.45,.86);composer.addPass(bloom);
composer.addPass(new OutputPass());
function resize(){const w=innerWidth,h=innerHeight;renderer.setPixelRatio(PR());renderer.setSize(w,h,false);composer.setPixelRatio(PR());composer.setSize(w,h);bloom.resolution.set(w/2,h/2);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

scene.add(new THREE.HemisphereLight(0x6a7fc0,0x2a1d14,1.1));
const ceil=new THREE.DirectionalLight(0xffd2a0,1.1);ceil.position.set(3,14,6);ceil.castShadow=true;ceil.shadow.mapSize.set(2048,2048);
Object.assign(ceil.shadow.camera,{left:-11,right:11,top:11,bottom:-11,near:1,far:40});ceil.shadow.bias=-.0006;ceil.shadow.normalBias=.02;scene.add(ceil);
const lampL=new THREE.PointLight(0xffa860,14,11,1.6);lampL.position.set(-6.3,2.1,2.5);scene.add(lampL);
const pendL=new THREE.PointLight(0xffc68a,12,10,1.6);pendL.position.set(3,2.3,-2.2);scene.add(pendL);
const tvL=new THREE.PointLight(0x6aa8ff,5,8,1.6);tvL.position.set(-4,1.3,-4.6);scene.add(tvL);
const bathL=new THREE.PointLight(0xcfe6ff,5,7,1.7);bathL.position.set(5.8,2.4,4.8);scene.add(bathL);
const roomL=new THREE.PointLight(0xffb878,10,24,1.3);roomL.position.set(0,4.5,0);scene.add(roomL);

/* =============== 텍스처 · 재질 =============== */
function cTex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;if(rep)t.repeat.set(...rep);t.anisotropy=4;return t}
const woodTex=cTex(256,256,(g,w,h)=>{const cols=['#b07b4f','#a8724a','#b88457','#a06b43'];for(let i=0;i<8;i++){g.fillStyle=cols[i%4];g.fillRect(0,i*32,w,32);g.fillStyle='rgba(60,35,20,.35)';g.fillRect(0,i*32,w,2);const o=(i*97)%256;g.fillRect(o,i*32,2,32)}for(let k=0;k<200;k++){g.fillStyle=`rgba(80,45,25,${Math.random()*.08})`;g.fillRect(Math.random()*w,Math.random()*h,Math.random()*40,1)}},[4,3]);
const tileTex=cTex(128,128,(g,w,h)=>{g.fillStyle='#e8e2d6';g.fillRect(0,0,w,h);g.fillStyle='#d8cfbf';g.fillRect(0,0,64,64);g.fillRect(64,64,64,64);g.fillStyle='rgba(0,0,0,.12)';g.fillRect(0,0,w,2);g.fillRect(0,0,2,h);g.fillRect(0,63,w,2);g.fillRect(63,0,2,h)},[4,3]);
const bathTex=cTex(64,64,(g,w,h)=>{g.fillStyle='#bcdde4';g.fillRect(0,0,w,h);g.fillStyle='rgba(255,255,255,.5)';g.fillRect(0,0,w,2);g.fillRect(0,0,2,h)},[8,5]);
const wallTex=cTex(128,128,(g,w,h)=>{g.fillStyle='#e9d7c0';g.fillRect(0,0,w,h);for(let i=0;i<8;i++){g.fillStyle=i%2?'#e3cfb6':'#ecdcc6';g.fillRect(i*16,0,16,h)}},[10,2]);
const rugTex=cTex(128,128,(g,w,h)=>{g.fillStyle='#b9504a';g.fillRect(0,0,w,h);g.globalAlpha=.55;g.fillStyle='#e9a26a';for(let i=0;i<8;i++){g.fillRect(i*16,0,8,h);g.fillRect(0,i*16,w,8)}},[2,1.5]);
const nightTex=cTex(128,96,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#040814');gr.addColorStop(1,'#1d2a4c');g.fillStyle=gr;g.fillRect(0,0,w,h);for(let i=0;i<40;i++){g.fillStyle=`rgba(255,255,255,${Math.random()*.8+.2})`;g.fillRect(Math.random()*w,Math.random()*h*.7,1,1)}g.fillStyle='#fff6d8';g.beginPath();g.arc(96,24,9,0,7);g.fill();g.fillStyle='#0a1020';for(let i=0;i<9;i++){const bh=20+Math.random()*30;g.fillRect(i*15,h-bh,13,bh);g.fillStyle='#ffd27a';for(let k=0;k<4;k++)if(Math.random()<.5)g.fillRect(i*15+3+(k%2)*5,h-bh+5+Math.floor(k/2)*8,2,3);g.fillStyle='#0a1020'}});
const MC=new Map();const mat=(c,o={})=>{const k=c+JSON.stringify(o);if(!MC.has(k))MC.set(k,new THREE.MeshLambertMaterial({color:c,...o}));return MC.get(k)};
const glow=c=>new THREE.MeshBasicMaterial({color:c});
const SOFT=cTex(64,64,(g,w)=>{const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.35,'rgba(255,255,255,.5)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,64,64)});

function M(geo,m,x,y,z,p){const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;(p||scene).add(o);return o}
const box=(w,h,d,c,x,y,z,p)=>M(new THREE.BoxGeometry(w,h,d),typeof c==='object'?c:mat(c),x,y,z,p);
const cyl=(a,b,h,c,x,y,z,p,s=16)=>M(new THREE.CylinderGeometry(a,b,h,s),typeof c==='object'?c:mat(c),x,y,z,p);
const sph=(r,c,x,y,z,p)=>M(new THREE.SphereGeometry(r,14,10),typeof c==='object'?c:mat(c),x,y,z,p);
const clickables=[],floors=[];
function G(action){const g=new THREE.Group();g.userData.action=action;scene.add(g);clickables.push(g);return g}
function floor(w,d,m,x,z,y=0){const o=new THREE.Mesh(new THREE.PlaneGeometry(w,d),m);o.rotation.x=-Math.PI/2;o.position.set(x,y,z);o.receiveShadow=true;scene.add(o);floors.push(o);return o}

/* =============== 집 =============== */
floor(16,12,new THREE.MeshLambertMaterial({map:woodTex}),0,0);
floor(8,6,new THREE.MeshLambertMaterial({map:tileTex}),4,-3,.01);
floor(4,2.5,new THREE.MeshLambertMaterial({map:bathTex}),6,4.75,.012);
{const r=floor(3.6,2.6,new THREE.MeshLambertMaterial({map:rugTex}),-4,-.6,.02)}
// 바깥 어둠 바닥
{const o=new THREE.Mesh(new THREE.PlaneGeometry(120,120),mat(0x0d1220));o.rotation.x=-Math.PI/2;o.position.y=-.05;o.receiveShadow=true;scene.add(o)}
const wallM=new THREE.MeshLambertMaterial({map:wallTex});
box(16.4,3.2,.3,wallM,0,1.6,-6.15);box(.3,3.2,12.3,wallM,-8.15,1.6,0);
box(16.4,.12,.32,0x8a6040,0,.06,-5.98);box(.32,.12,12.3,0x8a6040,-7.98,.06,0);
box(16.6,.35,.3,0x5a4232,0,.17,6.15);box(.3,.35,12.5,0x5a4232,8.15,.17,0);
// 창문 (밤하늘)
function windowAt(x,y,z,ry,w,h){const g=new THREE.Group();g.position.set(x,y,z);g.rotation.y=ry;scene.add(g);
  const gl=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:nightTex}));gl.position.z=.02;g.add(gl);
  const fm=mat(0xf4ece0);box(w+.16,.08,.1,fm,0,h/2,.04,g);box(w+.16,.08,.1,fm,0,-h/2,.04,g);box(.08,h,.1,fm,-w/2,0,.04,g);box(.08,h,.1,fm,w/2,0,.04,g);box(.05,h,.06,fm,0,0,.05,g);box(w+.3,.06,.22,fm,0,-h/2-.05,.1,g);
  const cur=mat(0xc9a3c8);box(.35,h+.3,.06,cur,-w/2-.25,0,.1,g);box(.35,h+.3,.06,cur,w/2+.25,0,.1,g);}
windowAt(-7.99,1.75,-2.6,Math.PI/2,2.2,1.3);windowAt(4,2.05,-5.99,0,1.6,.95);windowAt(-1.2,1.85,-5.99,0,1.4,1.1);
// 액자
[[-6.5,2.05,0xffd166,0x3f5fa8],[-5.6,1.85,0xf2b4bf,0x5a8a6a]].forEach(([x,y,c,b])=>{box(.7,.85,.06,0x6a4a32,x,y,-5.98);box(.56,.7,.03,c,x,y,-5.94);sph(.12,b,x,y-.05,-5.92)});
// 전구 줄 (뒷벽 위)
const bulbs=[];{const pts=[];for(let i=0;i<=26;i++){const x=-7.8+i*.6,y=2.85-Math.sin(i/26*Math.PI*4)*.14-.05;pts.push(new THREE.Vector3(x,y,-5.92))}
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x3a2e2a})));
  pts.forEach((p,i)=>{if(i%2)return;const b=new THREE.Mesh(new THREE.SphereGeometry(.05,8,6),glow([0xffd27a,0xffe7b0,0xffb46a][i%3]));b.position.copy(p).add(new THREE.Vector3(0,-.07,.02));scene.add(b);bulbs.push(b)})}
{const pts=[];for(let i=0;i<=18;i++){const z=-5.8+i*.6,y=2.85-Math.sin(i/18*Math.PI*3)*.14-.05;pts.push(new THREE.Vector3(-7.92,y,z))}
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x3a2e2a})));
  pts.forEach((p,i)=>{if(i%2)return;const b=new THREE.Mesh(new THREE.SphereGeometry(.05,8,6),glow([0xffd27a,0xffe7b0,0xffb46a][i%3]));b.position.copy(p).add(new THREE.Vector3(.02,-.07,0));scene.add(b);bulbs.push(b)})}

/* --- 거실 --- */

  ch.legs[0].rotation.x=sw*.8;ch.legs[1].rotation.x=-sw*.8;
  ch.inner.position.y=(ch.moving?Math.abs(Math.cos(ch.phase))*.07:0)+Math.sin(t*1.6+ch.phase%3)*.008;ch.inner.rotation.z=ch.moving?Math.sin(ch.phase)*.05:0;
  ch.tail.rotation.y=Math.sin(t*6+ch.phase)*.4;
  if(ch.pose==='work'){ch.arms[0].rotation.x=-1.1+Math.sin(t*14)*.35;ch.arms[1].rotation.x=-1.1-Math.sin(t*14)*.35;ch.headG.rotation.x=.25;ch.inner.position.y=Math.abs(Math.sin(t*7))*.04}
  else if(ch.pose==='cheer'){ch.arms[0].rotation.x=-2.7+Math.sin(t*14)*.2;ch.arms[1].rotation.x=-2.7-Math.sin(t*14)*.2;ch.headG.rotation.x=-.2}
  else if(ch.pose==='nag'){ch.arms[1].rotation.x=-1.6+Math.sin(t*16)*.4;ch.arms[0].rotation.x=0;ch.headG.rotation.x=0}
  else if(ch.pose==='sigh'){ch.arms[0].rotation.x=-.3;ch.arms[1].rotation.x=-.3;ch.headG.rotation.x=.4+Math.sin(t*2)*.05}
  else if(ch.pose==='heart'){ch.arms[0].rotation.x=-2.2;ch.arms[1].rotation.x=-2.2;ch.arms[0].rotation.z=-.6;ch.arms[1].rotation.z=.6;ch.headG.rotation.z=Math.sin(t*4)*.12}
  else{ch.arms[0].rotation.x=ch.moving?-sw*.6:0;ch.arms[1].rotation.x=ch.moving?sw*.6:0;ch.headG.rotation.x=0;ch.headG.rotation.z=0}
  if(ch.pose!=='heart'){ch.arms[0].rotation.z=-.25;ch.arms[1].rotation.z=.25}
  ch.eyes.forEach(e=>e.scale.y=Math.sin(t*.9+ch.phase)>.995?.1:1);
}

  if(!S)return;
  $('dayChip').textContent=`${S.day}일차 / 7`;$('apChip').innerHTML='⚡'+Array.from({length:AP_MAX},(_,i)=>`<span class="${i<S.ap?'':'off'}"></span>`).join('');
  $('mot').style.width=S.mot+'%';$('motV').textContent=S.mot;$('res').style.width=S.res+'%';$('resV').textContent=S.res>=70?S.res+' 삐짐':S.res;$('hab').style.width=S.hab+'%';$('habV').textContent=S.hab+'%';
  $('endBtn').disabled=S.busy||S.over;
  screenMat.color.set(S.tvOff?0x0b0b10:S.tv?0x3fbf5a:0x5a8cff);tvL.intensity=S.tvOff?0:5;
  const can=CHORES.some(c=>!S.done[c.id]&&S.mot>=reqOf(c));
  document.querySelector('[data-k=order]').classList.toggle('hot',can&&!S.busy);
  document.querySelectorAll('.act').forEach(b=>b.disabled=S.ap<=0&&b.dataset.k!=='order');
  if($('sheet').classList.contains('show')&&$('sheet').dataset.k==='chores')openChores();
}
function show(em,t,html,btn){$('mEm').textContent=em;$('mTitle').textContent=t;$('mText').innerHTML=html;$('mBtn').textContent=btn;$('modal').classList.remove('hide')}
const HELP=`<p>🛋️ 소파에 붙은 곰돌이 남편을 7일 안에 <b>스스로 집안일 하는 남자</b>로 개조하세요.</p><p>💬 아래 버튼을 누르면 아내가 남편에게 걸어가서 작전을 써요. 의욕을 올린 뒤 🧹 <b>시키기</b>를 누르면 남편이 직접 걸어가서 해요.</p><p>✨ 같은 일을 할수록 습관이 돼서 쉬워져요. 🍗 치킨은 냉장고에서, 🙈 리모컨은 TV 앞에서!</p><p>😤 잔소리는 반발심을 크게 올려요. 반발심 100이 되면 남편이 가출해요.</p><p>팁: <b>칭찬 2번 → 같이 하자 → 시키기</b></p>`;
$('mText').innerHTML=HELP;
$('mBtn').onclick=()=>{$('modal').classList.add('hide');if(!S||S.over)newGame()};
$('helpBtn').onclick=()=>show('🛋️','하는 법',HELP,S&&!S.over?'계속하기':'시작하기');
$('endBtn').onclick=endDay;
let overview=false;$('viewBtn').onclick=()=>{overview=!overview;toast(overview?'집 전체 보기':'아내 따라가기',1200)};

/* =============== 입력 =============== */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();let down=null;
canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY}});
canvas.addEventListener('pointerup',e=>{
  if(!down||Math.hypot(e.clientX-down.x,e.clientY-down.y)>12)return;down=null;if(!S||S.over)return;
  ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,camera);
  for(const h of ray.intersectObjects(clickables,true)){let o=h.object;if(!o.visible)continue;while(o&&!o.userData.action)o=o.parent;if(!o)continue;const k=o.userData.action;
    if(k==='husband'){if(S.busy){say(H,'지금 하는 중이잖아~');return}closeSheet();goHusband(()=>openChores());return}
    if(k==='tv'){walk(W,-4,-4.5,()=>{faceTo(W,-4,-6);toast(S.tvOff?'리모컨은 숨겨 뒀어요 🤫':'🙈 리모컨 버튼으로 리모컨을 숨길 수 있어요')});return}
    if(k==='fridge'){walk(W,6.95,-4.35,()=>{faceTo(W,7.35,-5.5);toast(S.used.chicken?'오늘 치킨은 이미 시켰어요':'🍗 치킨 버튼으로 치킨을 시킬 수 있어요')});return}
    if(CH[k]){const c=CH[k];walk(W,c.wife[0],c.wife[1],()=>{faceTo(W,c.look[0],c.look[1]);openInfo(c)});return}
  }
  const f=ray.intersectObjects(floors,false)[0];
  if(f){closeSheet();const[x,z]=nearestFree(f.point.x,f.point.z);ring.position.set(x,.04,z);ring.visible=true;ring.material.opacity=.7;ring.scale.setScalar(1);walk(W,x,z)}
});

/* =============== 루프 =============== */
const camT=new THREE.Vector3(),camP=new THREE.Vector3();let first=true;
const clock=new THREE.Clock();
function loop(){
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  stepChar(W,dt);stepChar(H,dt);animChar(W,dt,t);animChar(H,dt,t);
  // 대기 중 아내가 남편 쳐다보기
  for(let i=parts.length-1;i>=0;i--){const s=parts[i],u=s.userData;u.life-=dt;u.v.y-=dt*1.5;s.position.addScaledVector(u.v,dt);s.material.opacity=Math.max(0,u.life);if(u.life<=0){scene.remove(s);s.material.dispose();parts.splice(i,1)}}
  stink.forEach(s=>{const k=(t*.45+s.userData.ph)%1.6;s.position.set(6.45+Math.sin(t*2+s.userData.ph)*.15+s.userData.ph*.05,.75+k,5.4);s.material.opacity=.55*(1-k/1.6)});
  if(ring.visible){ring.material.opacity-=dt*1.2;ring.scale.multiplyScalar(1+dt*.8);if(ring.material.opacity<=0)ring.visible=false}
  bulbs.forEach((b,i)=>b.scale.setScalar(.85+Math.sin(t*2+i)*.2));
  flame.scale.set(1+Math.sin(t*20)*.1,1.8+Math.sin(t*13)*.3,1);
  if(S&&!S.tvOff)tvL.intensity=4+Math.sin(t*9)*1+Math.sin(t*3.3)*1;
  lampL.intensity=14+Math.sin(t*1.3)*.4;
  const portrait=camera.aspect<.8;
  const off=overview?(portrait?new THREE.Vector3(0,38,23):new THREE.Vector3(0,15,12)):(portrait?new THREE.Vector3(0,11.5,9.6):new THREE.Vector3(0,9,8.5));
  const tgt=overview?new THREE.Vector3(0,0,portrait?.8:.5):new THREE.Vector3(clamp(W.root.position.x,-5.5,5.5),.6,clamp(W.root.position.z,-4.2,4));
  if(first){camT.copy(tgt);camP.copy(tgt).add(off);first=false}
  camT.lerp(tgt,Math.min(1,dt*3));camP.lerp(_v.copy(tgt).add(off),Math.min(1,dt*3));camera.position.copy(camP);camera.lookAt(camT);
  composer.render();
  placeLabel(WL,W);placeLabel(HL,H);
  requestAnimationFrame(loop);
}
lieDown();W.root.position.set(0,0,2.6);W.root.rotation.y=Math.PI;
$('loading').remove();
loop();
</script>
