<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>남편 개조 프로젝트</title>
<meta name="description" content="소파와 한 몸이 된 남편을 7일 안에 집안일 하는 남자로! 혼자 해도, 부부가 같이 해도 되는 3D 게임">
<meta name="theme-color" content="#0b0d14">
<meta property="og:type" content="website">
<meta property="og:title" content="남편 개조 프로젝트">
<meta property="og:description" content="소파와 한 몸이 된 남편을 7일 안에 집안일 하는 남자로!">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"/vendor/three.module.min.js","three/addons/":"/vendor/jsm/"}}</script>
<style>
:root{--ink:#eef0f7;--dim:#9aa3bd;--panel:rgba(22,24,32,.86);--panel2:rgba(40,43,56,.92);--line:rgba(255,255,255,.08);--accent:#ff9a4a;--gold:#e9c46a;--me:#c0453a;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0d14;color:var(--ink);font-family:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
canvas#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 50%,rgba(0,0,0,.5) 100%)}
button{font:inherit;color:inherit;cursor:pointer}
.pn{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 6px 20px rgba(0,0,0,.35)}
.hide{display:none!important}

/* 머리 위 표시 */
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:5px;will-change:transform}
.tag .name{font-size:13px;padding:4px 11px;border-radius:8px;background:rgba(20,22,30,.78);color:#f2f0ea;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tag .name i{font-style:normal;font-size:11px;background:#3f5fa8;color:#fff;border-radius:6px;padding:1px 7px}
.tag.me .name i{background:var(--me)}
.tag .state{font-size:14px;padding:4px 12px;border-radius:8px;background:linear-gradient(180deg,#e9c46a,#c99a3a);color:#2a1c06;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.tag .meter{display:flex;align-items:center;gap:7px;background:rgba(20,22,30,.82);border-radius:8px;padding:4px 9px;font-size:15px}
.tag .meter .bar{width:82px;height:9px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
.tag .meter .bar b{display:block;height:100%;border-radius:6px;background:#5fd38d;transition:width .35s}
.tag .bubble{max-width:200px;font-size:14px;line-height:1.45;padding:8px 12px;border-radius:14px;background:rgba(250,246,238,.97);color:#231c16;box-shadow:0 6px 18px rgba(0,0,0,.35);word-break:keep-all;opacity:0;transform:translateY(4px);transition:opacity .25s,transform .25s;position:relative;text-align:center}
.tag .bubble.show{opacity:1;transform:none}
.tag .bubble:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:rgba(250,246,238,.97);border-bottom:0}
.tag .bubble.emo{background:transparent;box-shadow:none;font-size:30px;padding:0}
.tag .bubble.emo:after{display:none}
.float{position:fixed;transform:translate(-50%,0);font-size:17px;pointer-events:none;animation:up 1.2s forwards;text-shadow:0 1px 6px #000;white-space:nowrap;z-index:3}
@keyframes up{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-60px}}

/* 왼쪽 위 카드 */
.card0{position:fixed;top:calc(10px + var(--st));left:10px;right:76px;max-width:460px;border-radius:16px;padding:12px 14px;pointer-events:none}
.card0 .t1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card0 .logo{font-size:19px;letter-spacing:-.5px}
.card0 .logo small{font-size:12px;color:var(--dim);margin-left:6px}
.card0 .ap{font-size:13px;color:var(--dim);display:flex;align-items:center;gap:3px}
.card0 .ap span{flex:0 0 8px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px rgba(255,154,74,.7)}
.card0 .ap span.off{background:rgba(255,255,255,.14);box-shadow:none}
.card0 .sub{margin-top:8px;background:rgba(255,255,255,.05);border-radius:10px;padding:7px 10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.stat label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim)}
.stat label b{font-weight:400;color:var(--ink)}
.track{height:5px;background:rgba(255,255,255,.1);border-radius:5px;overflow:hidden;margin-top:4px}
.fill{height:100%;border-radius:5px;transition:width .4s}
.card0 .who{margin-top:6px;font-size:12px;color:var(--dim)}

/* 오른쪽 아이콘 줄 */
.rcol{position:fixed;top:calc(10px + var(--st));right:10px;display:flex;flex-direction:column;gap:8px}
.ib{width:56px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
.ib svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib:active{transform:scale(.95)}
.ib:disabled{opacity:.35}

/* 왼쪽 행동 버튼 */
.lcol{position:fixed;left:10px;bottom:calc(12px + var(--sb));display:flex;flex-direction:column;gap:7px;border-radius:16px;padding:7px}
.lb{width:64px;height:62px;border:0;border-radius:12px;background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12.5px;color:#e6e8f0}
.lb .i{font-size:21px;line-height:1}
.lb:active{transform:scale(.95)}
.lb:disabled{opacity:.35}
.lb.hot{box-shadow:0 0 0 2px var(--gold) inset,0 0 14px rgba(233,196,106,.4)}

/* 아래 가운데 패널 */
.bpanel{position:fixed;left:94px;right:86px;bottom:calc(12px + var(--sb));border-radius:16px;padding:7px;display:flex;flex-direction:column;gap:7px;max-height:58vh;overflow:auto}
.bpanel .q{font-size:13.5px;color:#f2e6c8;padding:4px 6px 0;line-height:1.45}
.bpanel .q small{color:var(--dim);font-size:12px}
.ch{border:0;border-radius:11px;background:var(--panel2);padding:12px 12px;font-size:15px;text-align:center;color:#eef0f7;line-height:1.3}
.ch small{display:block;font-size:11.5px;color:var(--dim);margin-top:3px}
.ch:active{transform:scale(.98)}
.ch:disabled{opacity:.38}
.ch.hot{box-shadow:0 0 0 2px var(--gold) inset}
.ch.go{background:linear-gradient(180deg,#f0b057,#d9822e);color:#2a1406}
.ch.go small{color:#5a3410}
.ch .pb{height:5px;border-radius:4px;background:rgba(255,255,255,.12);margin-top:6px;overflow:hidden}
.ch .pb b{display:block;height:100%;background:#5fd38d}
.row2{display:flex;gap:7px}.row2 .ch{flex:1;padding:10px 6px}
.rb{position:fixed;right:10px;bottom:calc(12px + var(--sb));width:68px;height:74px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12.5px;border:1px solid var(--line)}
.rb .i{font-size:23px}

.toast{position:fixed;left:50%;top:calc(150px + var(--st));transform:translate(-50%,-8px);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;z-index:5;max-width:88vw;text-align:center;line-height:1.5}
.toast.show{opacity:1;transform:translate(-50%,0)}
#night{position:fixed;inset:0;background:#05070e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:23px;opacity:0;pointer-events:none;transition:opacity .7s;z-index:8;text-align:center;padding:20px}
#night.on{opacity:1}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9;transition:opacity .35s}
#flash.on{opacity:.9;transition:none}

/* 모달 */
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,6,10,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:10;padding:16px}
.card{width:min(400px,100%);background:rgba(20,22,30,.97);border:1px solid var(--line);border-radius:22px;padding:22px 20px;text-align:center;max-height:92vh;overflow:auto}
.card .em{font-size:50px;line-height:1.1}
.card h2{margin:6px 0 8px;font-weight:400;font-size:23px}
.card p{margin:0 0 8px;color:var(--dim);font-size:14px;line-height:1.7;text-align:left}
.card p b{color:var(--ink);font-weight:400}
.primary{font-size:16px;width:100%;padding:13px;border-radius:13px;border:0;background:linear-gradient(180deg,#f0b057,#d9822e);color:#2a1406;margin-top:10px}
.ghost{font-size:15px;width:100%;padding:12px;border-radius:13px;border:1px solid rgba(255,255,255,.14);background:transparent;margin-top:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.pick{border:2px solid transparent;background:rgba(255,255,255,.05);border-radius:14px;padding:10px 8px;text-align:center}
.pick .i{font-size:28px}
.pick b{display:block;font-weight:400;font-size:14.5px;margin-top:2px}
.pick small{display:block;color:var(--dim);font-size:11.5px;line-height:1.45;margin-top:3px}
.pick.sel{border-color:var(--accent);background:rgba(255,154,74,.12)}
.end{background:rgba(255,255,255,.05);border-radius:12px;padding:10px 6px}
.end .i{font-size:28px}.end b{display:block;font-weight:400;font-size:13px;margin-top:3px}.end small{display:block;color:var(--dim);font-size:11px;margin-top:2px;line-height:1.4}
.end.lock{opacity:.45}
.sw{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 14px}
.sw button{border:2px solid transparent;border-radius:12px;padding:4px;background:rgba(255,255,255,.05);font-size:11px;color:var(--dim);width:72px}
.sw button i{display:block;height:30px;border-radius:8px;margin-bottom:4px}
.sw button.sel{border-color:var(--accent);color:var(--ink)}
.sw button:disabled{opacity:.5}
.lbl{font-size:13px;color:var(--dim);text-align:left;margin-top:6px}
.code{font-size:34px;letter-spacing:8px;margin:6px 0;color:#ffd9a8}
.linkbox{font-size:12.5px;color:var(--dim);word-break:break-all;background:rgba(255,255,255,.05);border-radius:10px;padding:8px}
#shareImg{width:100%;border-radius:12px;margin-top:6px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:14px;z-index:20;background:#0b0d14}
@media (max-width:380px){.lb{width:58px;height:56px;font-size:11.5px}.bpanel{left:84px;right:80px}.rb{width:62px}}
</style>
</head>
<body>
<div id="loading">집에 들어가는 중…</div>
<canvas id="scene"></canvas>
<div id="vignette"></div>
<div id="labels"></div>

<div class="card0 pn">
  <div class="t1"><div class="logo">🛋️ 남편 개조 <small id="dayTxt">1일차 / 7</small></div><div class="ap" id="apBox"></div></div>
  <div class="sub">
    <div class="stat"><label>의욕 <b id="motV">0</b></label><div class="track"><div class="fill" id="mot" style="background:#5fd38d"></div></div></div>
    <div class="stat"><label>반발심 <b id="resV">0</b></label><div class="track"><div class="fill" id="res" style="background:#ef6a5a"></div></div></div>
    <div class="stat"><label>개조율 <b id="habV">0%</b></label><div class="track"><div class="fill" id="hab" style="background:linear-gradient(90deg,#f0b057,#ff7a9a)"></div></div></div>
  </div>
  <div class="who" id="whoTxt"></div>
</div>

<div class="rcol">
  <button class="ib pn" id="shareBtn" title="공유"><svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg></button>
  <button class="ib pn" id="helpBtn" title="도움말"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.2v.1"/></svg></button>
  <button class="ib pn" id="soundBtn" title="소리"><svg viewBox="0 0 24 24" id="soundIco"></svg></button>
  <button class="ib pn" id="decorBtn" title="꾸미기"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  <button class="ib pn" id="viewBtn" title="시점"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
  <button class="ib pn" id="endBtn" title="하루 마치기"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
</div>

<div class="lcol pn" id="lcol"></div>
<div class="bpanel pn" id="bpanel"></div>
<button class="rb pn" id="bookBtn"><span class="i">📖</span>엔딩 도감</button>

<div class="toast pn" id="toast"></div>
<div id="night"></div>
<div id="flash"></div>
<div class="overlay" id="modal"><div class="card" id="modalCard"></div></div>

<script type="module" src="./house.js"></script>
</body>
</html>
