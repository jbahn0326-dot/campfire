<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>모닥불 캠핑장, 잠깐 쉬어가요</title>
<meta name="description" content="같이 걷고, 불 앞에 앉고, 이야기하는 3D 온라인 캠핑장. 장작을 넣고, 마시멜로를 굽고, 호숫가에서 낚시하고, 언덕에서 별똥별에 소원을 빌어요.">
<meta name="theme-color" content="#0b0f1a">
<meta property="og:type" content="website">
<meta property="og:title" content="모닥불 캠핑장, 잠깐 쉬어가요">
<meta property="og:description" content="같이 걷고, 불 앞에 앉고, 이야기하는 3D 온라인 캠핑장">
<meta property="og:image" content="/og.png">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root{--ink:#f3e6cf;--dim:#a99d8a;--panel:rgba(18,16,22,.74);--line:rgba(255,200,140,.16);--ember:#ff9a3d}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#0b0f1a;color:var(--ink);font-family:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden;overscroll-behavior:none}
  canvas#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
  button{font:inherit;color:inherit}
  .panel{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

  /* 이름표와 말풍선 */
  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .tag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:4px;will-change:transform}
  .tag .name{font-size:12px;padding:2px 7px;border-radius:999px;background:rgba(10,10,14,.45);color:rgba(245,232,210,.9);white-space:nowrap;pointer-events:auto;cursor:pointer;text-shadow:0 1px 3px #000}
  .tag.me .name{color:#ffd9a8;cursor:default}
  .tag .bubble{max-width:200px;font-size:14px;line-height:1.4;padding:7px 11px;border-radius:14px;background:rgba(250,244,232,.95);color:#2a2018;box-shadow:0 4px 14px rgba(0,0,0,.35);word-break:break-word;opacity:0;transform:translateY(4px);transition:opacity .25s,transform .25s;position:relative}
  .tag .bubble.show{opacity:1;transform:none}
  .tag .bubble:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:rgba(250,244,232,.95);border-bottom:0}
  .tag .bubble.emo{background:transparent;box-shadow:none;font-size:26px;padding:0}
  .tag .bubble.emo:after{display:none}
  .tag .sub{font-size:10px;color:rgba(200,185,160,.6);text-shadow:0 1px 3px #000}

  /* 상단 정보 */
  .hud{position:fixed;top:14px;left:16px;pointer-events:none;text-shadow:0 1px 6px #000}
  .hud .zone{font-size:22px;letter-spacing:.04em}
  .hud .line{font-size:13px;color:var(--dim);margin-top:3px}
  .hud .line b{color:var(--ink);font-weight:400}
  .top-right{position:fixed;top:12px;right:12px;display:flex;gap:6px;align-items:center}
  .pill{font-size:13px;border-radius:999px;padding:7px 12px;cursor:pointer;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .pill:hover{background:rgba(255,154,61,.2)}
  .pill.on{background:rgba(255,154,61,.25);border-color:rgba(255,154,61,.45)}

  /* 하단: 행동 버튼 + 채팅 */
  .bottom{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:min(560px,calc(100vw - 20px))}
  .actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .act{border-radius:14px;padding:8px 12px;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:13px;user-select:none;-webkit-user-select:none;touch-action:none;transition:transform .1s,background .15s}
  .act .i{font-size:18px}
  .act:hover{background:rgba(255,170,90,.16)}
  .act:active{transform:scale(.96)}
  .act.on{background:rgba(255,154,61,.28);border-color:rgba(255,154,61,.5)}
  .act.hot{animation:hot .5s ease-in-out infinite alternate;background:rgba(255,200,90,.35)}
  @keyframes hot{to{box-shadow:0 0 18px rgba(255,200,90,.7)}}
  .act[disabled]{opacity:.45;pointer-events:none}
  .chatbar{display:flex;gap:6px;width:100%;border-radius:16px;padding:5px}
  .chatbar input{flex:1;min-width:0;font:inherit;font-size:15px;color:var(--ink);background:transparent;border:0;outline:none;padding:8px 10px}
  .chatbar input::placeholder{color:rgba(200,185,160,.55)}
  .chatbar .send{border:0;background:rgba(255,154,61,.25);border-radius:12px;padding:0 14px;cursor:pointer}
  .chatbar .icon{border:0;background:transparent;cursor:pointer;font-size:18px;padding:0 6px}
  .emotes{display:none;gap:4px;padding:6px;border-radius:14px}
  .emotes.show{display:flex;flex-wrap:wrap;justify-content:center}
  .emotes button{border:0;background:rgba(255,255,255,.05);border-radius:10px;padding:6px 9px;cursor:pointer;font-size:12px;display:flex;flex-direction:column;align-items:center}
  .emotes button span{font-size:20px}
  .emotes button:hover{background:rgba(255,170,90,.18)}

  /* 대화 기록 */
  #log{position:fixed;left:14px;bottom:130px;width:min(300px,40vw);display:flex;flex-direction:column;gap:3px;pointer-events:none;font-size:13px}
  #log div{background:rgba(10,10,14,.5);padding:4px 9px;border-radius:10px;width:fit-content;max-width:100%;text-shadow:0 1px 2px #000;transition:opacity 1s;word-break:break-word}
  #log div b{font-weight:400;color:#ffd9a8;margin-right:6px}
  #log div.sys{color:var(--dim)}

  /* 미니맵 */
  #mini{position:fixed;right:14px;bottom:16px;width:140px;height:140px;border-radius:50%;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.45)}

  .toast{position:fixed;left:50%;top:18%;transform:translate(-50%,-8px);padding:10px 16px;border-radius:12px;font-size:15px;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap;z-index:5}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  .menu{position:fixed;display:none;flex-direction:column;border-radius:12px;padding:4px;z-index:6;min-width:120px}
  .menu.show{display:flex}
  .menu button{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px}
  .menu button:hover{background:rgba(255,170,90,.18)}
  .menu .who{font-size:12px;color:var(--dim);padding:4px 10px 2px}

  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,6,10,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:10}
  .overlay.hide{display:none}
  .card{width:min(380px,92vw);background:rgba(22,19,22,.94);border:1px solid var(--line);border-radius:20px;padding:26px 24px;text-align:center}
  .card h2{margin:0 0 6px;font-weight:400;font-size:26px;letter-spacing:.04em}
  .card p{margin:0 0 16px;color:var(--dim);font-size:14px;line-height:1.65}
  .card input{width:100%;font:inherit;font-size:16px;padding:11px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:var(--ink);text-align:center;outline:none}
  .card input:focus{border-color:rgba(255,154,61,.5)}
  .swatches{display:flex;justify-content:center;gap:10px;margin:16px 0 18px;flex-wrap:wrap}
  .swatches button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
  .swatches button.sel{border-color:var(--ink);transform:scale(1.12)}
  .primary{font-size:16px;width:100%;padding:12px;border-radius:12px;border:0;background:linear-gradient(180deg,#ffb35c,#f0782e);color:#2a1406;cursor:pointer}
  .ghost{font-size:15px;padding:11px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:transparent;cursor:pointer}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  .keys{font-size:12px;color:var(--dim);margin-top:14px;line-height:1.7}
  #tentView{position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;padding-bottom:150px;pointer-events:none;background:radial-gradient(ellipse at center,rgba(255,170,90,.12),rgba(8,6,6,.75) 70%)}
  #tentView.show{display:flex}
  #tentView .card{pointer-events:auto;width:auto;padding:16px 20px}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:14px;z-index:20;background:#0b0f1a}
  #loading.hide{display:none}

  @media (max-width:640px){
    .hud .zone{font-size:18px}
    .top-right .label{display:none}
    #mini{width:96px;height:96px;bottom:auto;top:58px;right:10px}
    #log{bottom:auto;top:96px;left:12px;width:62vw;font-size:12px}
    .act{padding:7px 10px;font-size:12px}
  }
</style>
</head>
<body>
<div id="loading">캠핑장으로 가는 중…</div>
<canvas id="scene" tabindex="0"></canvas>
<div id="labels"></div>

<div class="hud">
  <div class="zone" id="zone">모닥불 캠핑장</div>
  <div class="line" id="countLine">불을 지피는 중…</div>
  <div class="line" id="weatherLine"></div>
</div>

<div class="top-right">
  <button class="pill panel" id="inviteBtn">🔗 <span class="label">친구 부르기</span></button>
  <a class="pill panel" id="donateBtn" href="#" target="_blank" rel="noopener" style="display:none">☕ <span class="label">후원하기</span></a>
  <button class="pill panel" id="soundBtn">🔈</button>
</div>

<div id="log"></div>
<canvas id="mini" width="280" height="280"></canvas>

<div class="bottom">
  <div class="emotes panel" id="emotes">
    <button data-e="wave"><span>👋</span>인사</button>
    <button data-e="nod"><span>🙂</span>끄덕</button>
    <button data-e="heart"><span>💛</span>하트</button>
    <button data-e="warm"><span>🤲</span>손 녹이기</button>
    <button data-e="yawn"><span>🥱</span>하품</button>
    <button data-e="look"><span>🌌</span>하늘 보기</button>
    <button data-e="sleep"><span>💤</span>꾸벅</button>
  </div>
  <div class="actions" id="actions"></div>
  <form class="chatbar panel" id="chatForm" autocomplete="off">
    <button type="button" class="icon" id="emoteBtn" title="몸짓">🙂</button>
    <input id="chatIn" maxlength="80" placeholder="가까이 있는 사람에게 말하기 (Enter)" enterkeyhint="send">
    <button class="send" type="submit">말하기</button>
  </form>
</div>

<div class="menu panel" id="peerMenu">
  <div class="who" id="menuWho"></div>
  <button id="menuMute">🙈 이 사람 숨기기</button>
  <button id="menuReport">🚩 신고하기</button>
</div>

<div id="tentView"><div class="card panel"><div style="margin-bottom:10px">⛺ 텐트 안에서 쉬는 중이에요</div><button class="ghost" id="tentExit" style="width:100%">밖으로 나가기</button></div></div>

<div class="toast panel" id="toast"></div>

<div class="overlay" id="intro">
  <div class="card">
    <h2>🔥 모닥불 캠핑장</h2>
    <p>같이 걷고, 불 앞에 앉고, 이야기해요.<br>호숫가에서 낚시하고, 언덕에서 별을 봐요.</p>
    <input id="nickIn" maxlength="10" placeholder="이름 (비워두면 자동으로)">
    <div class="swatches" id="swatches"></div>
    <button class="primary" id="enterBtn">캠핑장 들어가기</button>
    <div class="keys">땅을 클릭(탭)하면 걸어가요 · 방향키/WASD도 돼요<br>마우스 휠·두 손가락으로 확대/축소</div>
  </div>
</div>

<div class="overlay hide" id="wishModal">
  <div class="card">
    <h2>🌠</h2>
    <p>별똥별에 빌 소원을 적어요.<br>나만 볼 수 있어요.</p>
    <input id="wishIn" maxlength="40" placeholder="소원 한 줄">
    <div style="height:14px"></div>
    <div class="row"><button class="ghost" id="wishCancel">그만두기</button><button class="primary" id="wishOk">빌기</button></div>
  </div>
</div>

<script type="module" src="/game.js"></script>
</body>
</html>
